name: "Pre-Deploy"
on:
  pull_request:
    branches:
      - production
  workflow_dispatch:
    inputs:
      skip_migration_check:
        description: "Skip the check-migrations step"
        type: boolean
        default: false

jobs:
  test-supabase:
    name: Test Supabase
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Check migrations are append-only
        if: ${{ !inputs.skip_migration_check }}
        run: |
          git fetch origin ${{ github.base_ref }}

          MODIFIED=$(git diff --name-only --diff-filter=MD origin/${{ github.base_ref }}...HEAD -- supabase/migrations/)

          if [ -n "$MODIFIED" ]; then
            echo "❌ The following migration files were modified or deleted:"
            echo "$MODIFIED"
            exit 1
          fi

          echo "✅ Only new migration files detected."

      - name: Check for migration changes
        id: migrations
        run: |
          git diff --quiet HEAD^ HEAD -- supabase/migrations \
            && echo "changed=false" >> $GITHUB_OUTPUT \
            || echo "changed=true" >> $GITHUB_OUTPUT

      - name: Setup Supabase CLI
        if: steps.migrations.outputs.changed == 'true'
        uses: supabase/setup-cli@v2
        with:
          version: 2.98.1

      - run: supabase db start
        if: steps.migrations.outputs.changed == 'true'
        env:
          GOOGLE_OAUTH_CLIENT_ID: not-set
          GOOGLE_OAUTH_CLIENT_SECRET: not-set
          GOOGLE_API_KEY: not-set

      - run: supabase test db
        if: steps.migrations.outputs.changed == 'true'

      - run: supabase stop --no-backup
        if: steps.migrations.outputs.changed == 'true'