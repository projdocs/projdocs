name: "Pre-Deploy"
on:
  pull_request:
    branches:
      - production

jobs:
  test-supabase:
    name: Test Supabase
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: Check migrations are append-only
        run: |
          git fetch origin ${{ github.base_ref }} --depth=1
          CHANGED=$(git diff --name-only --diff-filter=MDR origin/${{ github.base_ref }}...HEAD -- supabase/migrations/)
          if [ -n "$CHANGED" ]; then
            echo "Migration files must not be modified, deleted, or renamed:"
            echo "$CHANGED"
            exit 1
          fi

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v2
        with:
          version: 2.84.2

      - name: Cache Docker images
        uses: ScribeMD/docker-cache@0.5.0
        with:
          key: docker-${{ runner.os }}-${{ hashFiles('supabase/config.toml') }}

      - run: supabase db start

      - run: supabase test db

      - run: supabase stop --no-backup