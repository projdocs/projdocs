name: Release
on:
  workflow_dispatch:
    inputs:
      type:
        type: choice
        description: "Version bump type"
        options: [ PATCH, MINOR, MAJOR ]
        default: PATCH
        required: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

jobs:
  guard:
    runs-on: ubuntu-24.04
    steps:
      - name: Enforce production branch
        if: github.ref != 'refs/heads/production'
        run: |
          echo "❌ This workflow may only run from the 'production' branch."
          exit 1

  version:
    needs: guard
    uses: rdbc-corp/actions/.github/workflows/get-release-version.yml@main
    with:
      bump-type: ${{ github.event.inputs.type }}

  release:
    runs-on: ubuntu-24.04
    needs: [version]
    steps:
      - name: Generate release notes
        id: notes
        run: |
          NOTES=$(git log $(git describe --tags --abbrev=0 HEAD^)..HEAD --pretty=format:"%s" | awk '
            /^feat/     { print "✨ " $0 }
            /^fix/      { print "🐛 " $0 }
            /^chore/    { print "🔧 " $0 }
            /^docs/     { print "📚 " $0 }
            /^refactor/ { print "♻️  " $0 }
            /^perf/     { print "⚡ " $0 }
            /^test/     { print "🧪 " $0 }
            /^ci/       { print "👷 " $0 }
          ')
          echo "notes<<EOF" >> $GITHUB_OUTPUT
          echo "$NOTES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.version.outputs.next }}
          body: ${{ steps.notes.outputs.notes }}
          make_latest: true

      - name: Release (Go) (tag-only)
        uses: softprops/action-gh-release@v3
        with:
          tag_name: packages/go/${{ needs.version.outputs.next }}
          body: ${{ steps.notes.outputs.notes }}
          make_latest: false
