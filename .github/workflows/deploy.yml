name: "Pre-Deploy"
on:
  pull_request:
    branches:
      - production

jobs:
  test-supabase:
    name: Test Supabase
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: Check migrations are append-only
        run: |
          git fetch origin ${{ github.event.pull_request.base.sha }} --depth=1
          CHANGED=$(git diff --name-only --diff-filter=MDR ${{ github.event.pull_request.base.sha }} HEAD -- supabase/migrations/)
          if [ -n "$CHANGED" ]; then
            echo "Migration files must not be modified, deleted, or renamed:"
            echo "$CHANGED"
            exit 1
          fi

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v2
        with:
          version: 2.98.1

      - run: supabase db start

      - run: supabase test db

      - run: supabase stop --no-backup