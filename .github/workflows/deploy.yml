name: "Pre-Deploy"
on:
  pull_request:
    branches:
      - production

jobs:
  test-supabase:
    name: Test Supabase
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Check migrations are append-only
        run: |
          # Get list of changed files in supabase/migrations
          git fetch origin ${{ github.base_ref }}

          MODIFIED=$(git diff --name-only --diff-filter=MD origin/${{ github.base_ref }}...HEAD -- supabase/migrations/)

          if [ -n "$MODIFIED" ]; then
            echo "❌ The following migration files were modified or deleted:"
            echo "$MODIFIED"
            exit 1
          fi

          echo "✅ Only new migration files detected."

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v2
        with:
          version: 2.98.1

      - run: supabase db start
        env:
          GOOGLE_OAUTH_CLIENT_ID: not-set
          GOOGLE_OAUTH_CLIENT_SECRET: not-set

      - run: supabase test db

      - run: supabase stop --no-backup